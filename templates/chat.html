<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpus Forge Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rag.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tools.css') }}"/>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    {% include "menu.html" %}
    <main id="main_container">
        <div id="files_sidebar">
            <h2>Files</h2>
            <hr>
            <form id="upload-form">
                <label for="file-input">Choose files to upload</label>
                <input type="file" id="file-input" name="file" required>
                <input type="submit" value="Upload">
            </form>
            {% if file_error is defined %}
                Error: {{file_error}}
            {% endif %}
            <ul id="file-list" style="list-style-type: none; padding: 0; margin-top: 20px;">
                </ul>
            <div id="document-overlay">
                <button id="close-overlay-btn">← Back to Files</button>
                <h3 id="overlay-title"></h3>
                <hr>
                <div id="overlay-content"></div>
                </div>
            </div>
        </div>
            
        <div id="chat_window">
            <h2>Chat</h2>
            <div id="dialogue">
                <!-- TODO: get history by polling /dialogue and render it here (via JS) -->
            </div>
            <div id="send_message">
                
                 <form method="post" id="chat-box">
                    <textarea placeholder="Enter your prompt..." id="input-box"></textarea>
                    <input type="submit" value="Send" id="send-btn">
                 </form>
            </div>
        </div>
        
        <div id="tools_sidebar">
            <h2>Tools</h2>
            <hr>
            <p>Select files from the left sidebar to generate study materials.</p>
            <!-- TODO: add action buttons (e.g. for quiz, flashcards...) and a list of generated content which you can open (links to open html files in the output folder) -->
            
            <div class="tool-buttons-container">
                <button id="btn-quiz" class="tool-btn">Generate Quiz</button>
                <button id="btn-flashcards" class="tool-btn">Generate Flashcards</button>
            </div>

            <p id="tool-status"></p>

            <div id="generated-tools-container">
                <h3 id="generated-tools-header" style="display: none;">Your Files:</h3>
                <ul id="generated-tools-list">
                    </ul>
            </div>
        </div>
    </main>
</body>
<footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/tools.js') }}"></script>
    <script src="{{ url_for('static', filename='js/rag.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</footer>
</html>
