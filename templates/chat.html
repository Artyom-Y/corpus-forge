<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corpus Forge Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat_style.css') }}"/>
</head>
<body>
    {% include "menu.html" %}
    <main id="main_container">
        <div id="files_sidebar">
            <h2>Files</h2>
            <hr>
            <p>Upload, remove, select files to be used for context here</p>
            <!-- TODO: add buttons to add, remove and select uploaded files. Add the list of files below -->
        </div>
            
        <div id="chat_window">
            <h2>Chat</h2>
            <div id="dialogue">
                <!-- TODO: get history by polling /dialogue and render it here (via JS) -->
            </div>
            <div id="send_message">
                <!-- TODO: message form and submit button. Can't send when the model is thinking -->
                 <form method="post" id="chat-box">
                    <textarea placeholder="Enter your prompt..." id="input-box"></textarea>
                    <input type="submit" value="Send" id="send-btn">
                 </form>
            </div>
        </div>
        
        <div id="tools_sidebar">
            <h2>Tools</h2>
            <hr>
            <p>Generate quizzes and flashcards</p>
            <!-- TODO: add action buttons (e.g. for quiz, flashcards...) and a list of generated content which you can open (links to open html files in the output folder) -->
        </div>
    </main>
</body>
<footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</footer>
</html>
