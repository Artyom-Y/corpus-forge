<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .flashcard-container {
            width: 90%;
            max-width: 600px;
            perspective: 1000px;
            margin-bottom: 20px;
        }
        .flashcard {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px; /* Padding for the content inside */
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: inherit; /* Inherit padding from .flashcard */
            box-sizing: border-box; /* Include padding in the element's total width and height */
            top: 0;
            left: 0;
            text-align: center; /* Center text within the inner div */
        }
        .flashcard-front {
            z-index: 2;
        }
        .flashcard-back {
            transform: rotateY(180deg);
            z-index: 1;
        }
        .navigation {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .nav-button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: 1px solid #007bff;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s, color 0.3s;
        }
        .nav-button:hover {
            background-color: #0056b3;
        }
        .counter {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="flashcard-container">
        <div class="flashcard" id="flashcard">
            <div class="flashcard-inner flashcard-front" id="flashcard-front"></div>
            <div class="flashcard-inner flashcard-back" id="flashcard-back"></div>
        </div>
    </div>
    <div class="counter" id="card-counter"></div>
    <div class="navigation">
        <button class="nav-button" onclick="prevCard()">&#8592; Previous</button>
        <button class="nav-button" onclick="nextCard()">Next &#8594;</button>
    </div>

    <script>
        const cards = [
            { term: "What is considered the 'most powerful stroke for software productivity, reliability, and simplicity'?", definition: "The progressive use of high-level languages for programming." },
            { term: "What factor of productivity gain is often attributed to the development of high-level languages?", definition: "At least a factor of five." },
            { term: "What is Assembly Language (ASM or asm)?", definition: "A low-level programming language with a very strong correspondence between instructions and machine code." },
            { term: "For what purposes is Assembly Language still considered irreplaceable?", definition: "For specific reasons or to interact directly with hardware in ways unsupported by higher-level languages." },
            { term: "Who created the first assembly code?", definition: "Kathleen and Andrew Donald Booth (in their 1947 work)." },
            { term: "Who are credited with the term 'assembly language' in its modern sense?", definition: "Wilkes, Wheeler and Gill (in their 1951 book The Preparation of Programs for an Electronic Digital Computer)." },
            { term: "What was Wilkes, Wheeler and Gill's initial meaning of 'assembly'?", definition: "A program that assembles another program consisting of several sections into a single program." },
            { term: "What is the conversion process from assembly source code called?", definition: "Assembly." },
            { term: "What are some common components supported in assembly languages besides instructions?", definition: "Comments, assembler directives, symbolic labels (e.g., memory locations, registers), and macros." },
            { term: "What does GCC stand for?", definition: "GNU Compiler Collection (formerly GNU C Compiler)." },
            { term: "What project is GCC part of?", definition: "The GNU Project." },
            { term: "What license is GCC distributed under?", definition: "GNU General Public License (GNU GPL)." },
            { term: "When and by whom was GCC first released?", definition: "1987, by Richard Stallman." },
            { term: "What language did GCC 1.0 (GNU C Compiler) initially handle?", definition: "The C programming language." },
            { term: "When was C++ compilation capability added to GCC?", definition: "December 1987." },
            { term: "What is GCC's significance in the free software world?", definition: "It has played an important role in the growth of free software and is one of the largest free programs." },
            { term: "Which operating systems have moved away from GCC to Clang?", definition: "FreeBSD and Apple macOS." },
            { term: "Why did FreeBSD and Apple macOS move to Clang from GCC?", definition: "Largely due to licensing reasons." },
            { term: "Name some platforms or OS for which GCC can compile code.", definition: "Windows, Android, iOS, Solaris, HP-UX, AIX, MS-DOS compatible operating systems." },
            { term: "What key role does GCC play in the GNU toolchain?", definition: "It is a key component used for most projects related to GNU and the Linux kernel." }
        ];

        let currentCardIndex = 0;
        let isFlipped = false;

        const flashcardElement = document.getElementById('flashcard');
        const flashcardFront = document.getElementById('flashcard-front');
        const flashcardBack = document.getElementById('flashcard-back');
        const cardCounterElement = document.getElementById('card-counter');

        function displayCard() {
            const card = cards[currentCardIndex];
            flashcardFront.textContent = card.term;
            flashcardBack.textContent = card.definition;
            
            if (isFlipped) {
                flashcardElement.classList.remove('flipped');
                isFlipped = false;
            }
            updateCounter();
        }

        function flipCard() {
            flashcardElement.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % cards.length;
            displayCard();
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + cards.length) % cards.length;
            displayCard();
        }

        function updateCounter() {
            cardCounterElement.textContent = `Card ${currentCardIndex + 1} of ${cards.length}`;
        }

        flashcardElement.addEventListener('click', flipCard);
        displayCard();
    </script>
</body>
</html>
